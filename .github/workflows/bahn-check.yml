name: Bahn-Angebote prüfen

on:
  schedule:
    - cron: '17 5,11,17 * * *'   # 3x täglich (UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      # Merkt sich bereits gemeldete Angebote zwischen den Läufen
      - uses: actions/cache@v4
        with:
          path: gemeldet.json
          key: gemeldet-${{ github.run_id }}
          restore-keys: gemeldet-
      - run: node check.js
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          EMPFAENGER: junesyamm@googlemail.com,schwoerer@posteo.de
          TAGE_VORAUS: 60
          MAX_PREIS: 30
